name: arvono-labels

services:
  studio:
    image: arvono-labels:fulfillment-20261019
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-20977}:3000"
    environment:
      FULFILLMENT_API_BASE_URL: "${FULFILLMENT_API_BASE_URL:-https://arvono-fulfillment-os.twriad96.workers.dev/api/v1/dispatch}"
      FULFILLMENT_API_KEY: "${FULFILLMENT_API_KEY:-}"
      LABEL_DATA_DIR: /data
    volumes:
      - label-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  label-data:
